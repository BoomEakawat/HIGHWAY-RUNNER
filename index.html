<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3-Lane Highway Runner (Pose Control)</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800&family=Sarabun:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="marquee">
    <h2 class="title">🏁 3-LANE HIGHWAY RUNNER 🏁</h2>
  </div>

  <div class="lane-legend">
    <span class="chip left">◀ LEFT</span>
    <span class="chip center">● CENTER</span>
    <span class="chip right">RIGHT ▶</span>
  </div>

  <div class="checker-strip"></div>

  <div class="controls">
    <button id="startBtn" type="button" onclick="initAI()">🔑 START ENGINE (CAMERA)</button>
    <button type="button" onclick="restartGame()">🔧 PIT STOP / RESTART</button>
    
    <!-- ส่วนเลือกสีรถ -->
    <div class="color-picker-group">
      <span class="color-picker-label">CAR COLOR:</span>
      <div class="color-swatches">
        <button type="button" class="color-swatch active" style="--swatch-color: #1d3557;" onclick="changePlayerColor('#1d3557', this)" title="Navy Blue"></button>
        <button type="button" class="color-swatch" style="--swatch-color: #e63946;" onclick="changePlayerColor('#e63946', this)" title="Racing Red"></button>
        <button type="button" class="color-swatch" style="--swatch-color: #ffd166;" onclick="changePlayerColor('#ffd166', this)" title="Speed Yellow"></button>
        <button type="button" class="color-swatch" style="--swatch-color: #2a9d8f;" onclick="changePlayerColor('#2a9d8f', this)" title="Emerald Green"></button>
        <button type="button" class="color-swatch" style="--swatch-color: black;" onclick="changePlayerColor('black', this)" title="Neon Purple"></button>
        <button type="button" class="color-swatch" style="--swatch-color: #f4f4f4;" onclick="changePlayerColor('#f4f4f4', this)" title="Pure White"></button>
      </div>
    </div>
  </div>

  <div class="hud">
    <div class="hud-panel">
      <div id="gameStatus">NOT STARTED</div>
    </div>
    <div class="hud-panel">
      <div id="gameScore">OVERTAKEN: 0</div>
    </div>
  </div>

  <div class="container">
    <!-- 1. Dash Cam -->
    <div class="screen-unit">
      <div class="screen-label">Dash Cam</div>
      <div class="bezel headlight">
        <div class="screen-wrap">
          <canvas id="cameraCanvas" width="400" height="400"></canvas>
        </div>
      </div>
    </div>

    <!-- 2. Road View -->
    <div class="screen-unit">
      <div class="screen-label">Road View</div>
      <div class="bezel taillight">
        <div class="screen-wrap">
          <canvas id="gameCanvas" width="450" height="500"></canvas>
        </div>
      </div>
    </div>

    <!-- 3. Diagnostics Side Panel (ย้ายมาไว้ตรงนี้) -->
    <div class="side-panel">
      <div class="box">
        <h3>Diagnostics</h3>
        <div id="result">Result: -</div>
        <div id="confidence">Confidence: -</div>
        <div id="action">Status: Not started</div>
      </div>

      <div class="box">
        <h3>Class Confidence</h3>
        <div id="class1" class="score">Class 1: -</div>
        <div id="class2" class="score">Class 2: -</div>
        <div id="class3" class="score">Class 3: -</div>
      </div>
    </div>
  </div>

  <!-- Library Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.3/dist/teachablemachine-pose.min.js"></script>

  <!-- Application Scripts -->
  <script src="audio.js"></script>
  <script src="game.js"></script>
  <script src="ai.js"></script>
</body>
</html>
